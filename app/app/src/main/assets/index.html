<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Messenger</title>
<style>
  body { margin:0; font-family: sans-serif; background:#111; color:#eee; display:flex; flex-direction:column; height:100vh; }
  #chat { flex:1; overflow-y:auto; padding:10px; }
  .msg { background:#2a2a2a; padding:8px 12px; margin:5px 0; border-radius:12px; max-width:80%; }
  .me { background:#0a84ff; color:#fff; margin-left:auto; }
  #bar { display:flex; padding:8px; background:#1c1c1e; gap:6px; }
  #inp { flex:1; padding:10px; border-radius:20px; border:none; background:#2a2a2a; color:#eee; }
  #send { padding:10px 16px; border:none; border-radius:20px; background:#0a84ff; color:#fff; }
</style>
</head>
<body>
  <div id="chat"></div>
  <div id="bar">
    <input id="inp" placeholder="Сообщение...">
    <button id="send">▶</button>
  </div>
<script>
  const chat = document.getElementById('chat');
  const inp = document.getElementById('inp');
  const btn = document.getElementById('send');

  function add(text, me) {
    const d = document.createElement('div');
    d.className = 'msg' + (me ? ' me' : '');
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  btn.onclick = () => {
    const t = inp.value.trim();
    if (!t) return;
    add(t, true);
    inp.value = '';
    // Эхо-ответ для теста (потом заменишь на WebSocket)
    setTimeout(() => add('Эхо: ' + t, false), 500);
  };

  inp.addEventListener('keydown', e => { if (e.key === 'Enter') btn.onclick(); });
</script>
</body>
</html>
